[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
firstcash = ["py.typed"]

[project]
name = "firstcash.py"
description = "A basic Python library to communicate with FirstCash' mobile app API."
authors = [
    {name = "AgentLoneStar007", email = "contactagent.3gxdf@simplelogin.com"}
]
keywords = ["api", "web", "web api", "http", "https", "http api", "https api", "rest", "restful", "restful api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed"
]
license = "MIT"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx"
]

[project.urls]
Homepage = "https://github.com/AgentLoneStar007/FirstCash.Py"
Documentation = "https://github.com/AgentLoneStar007/FirstCash.Py/tree/main/docs"
Issues = "https://github.com/AgentLoneStar007/FirstCash.Py/issues"